<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Database View</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(to right, #eef2f3, #ffffff);
    }

    h1 {
      text-align: center;
      padding: 25px 0;
      color: #2c3e50;
    }

    /* NAVBAR */
    .navbar {
      list-style-type: none;
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #2c3e50;
    }

    .navbar li {
      float: left;
    }

    .navbar li a,
    .navbar .dropbtn {
      display: inline-block;
      color: white;
      text-align: center;
      padding: 14px 16px;
      text-decoration: none;
      transition: 0.3s;
    }

    .navbar li a:hover,
    .navbar .dropdown:hover .dropbtn {
      background-color: #e74c3c;
    }

    .navbar li.dropdown {
      display: inline-block;
    }

    .navbar .dropdown-content {
      display: none;
      position: absolute;
      background-color: white;
      min-width: 160px;
      box-shadow: 0 8px 16px rgba(0,0,0,0.2);
      z-index: 1;
      border-radius: 10px;
      overflow: hidden;
    }

    .navbar .dropdown-content a {
      color: black;
      padding: 12px 16px;
      text-decoration: none;
      display: block;
    }

    .navbar .dropdown-content a:hover {
      background-color: #f1f1f1;
    }

    .navbar .dropdown:hover .dropdown-content {
      display: block;
    }

    /* TABLE CONTAINER */
    .div1 {
      width: 90%;
      max-width: 1100px;
      margin: 30px auto;
      padding: 20px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.15);
      overflow-x: auto;
    }

    /* TABLE */
    table {
      width: 100%;
      border-collapse: collapse;
      min-width: 900px;
    }

    th {
      background: hsl(0, 70%, 47%);
      color: white;
      padding: 12px;
      text-align: left;
    }

    td {
      padding: 12px;
      border-bottom: 1px solid #ddd;
    }

    tr:hover {
      background-color: #f5f5f5;
      transition: 0.2s;
    }

    /* DELETE BUTTON */
    button {
      background: #e74c3c;
      color: white;
      border: none;
      padding: 8px 12px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      background: #c0392b;
      transform: scale(1.05);
    }
  </style>
</head>

<script>
async function loadCheckouts() {
    try {
        const response = await fetch('/checkouts');
        const data = await response.json();

        const table = document.getElementById('bikeTableBody');
        table.innerHTML = "";

        data.forEach(row => {
            table.innerHTML += `
                <tr>
                    <td>${row.id}</td>
                    <td>${row.formType}</td>
                    <td>${row.accountName}</td>
                    <td>${row.bikeType}</td>
                    <td>${row.miles}</td>
                    <td>${row.condition}</td>
                    <td>${row.bikeId}</td>
                    <td>${row.returnNotes || ""}</td>
                    <td>${row.date}</td>
                    <td>
                      <button onclick="deleteRow(${row.id})">Delete</button>
                    </td>
                </tr>
            `;
        });

    } catch (err) {
        console.error(err);
    }
}

async function deleteRow(id) {
    await fetch(`/checkouts/${id}`, {
        method: "DELETE"
    });

    loadCheckouts();
}

loadCheckouts();
</script>

<body>

<!-- NAVBAR -->
<ul class="navbar">
  <li class="dropdown">
    <a href="javascript:void(0)" class="dropbtn">Dropdown</a>
    <div class="dropdown-content">
      <a href="index.html">Database View</a>
      <a href="Checkout-Return_Form.html">Checkout/Return Form</a>
    </div>
  </li>
</ul>

<!-- PAGE TITLE -->
<h1>Database View</h1>

<!-- TABLE CONTAINER -->
<div class="div1">
  <table>
    <thead>
      <tr>
        <th>ID</th>
        <th>Form Type</th>
        <th>Account Name</th>
        <th>Bike Type</th>
        <th>Miles</th>
        <th>Condition</th>
        <th>Bike ID</th>
        <th>Return Notes</th>
        <th>Date Submitted</th>
        <th>Action</th>
      </tr>
    </thead>

    <tbody id="bikeTableBody"></tbody>
  </table>
</div>

</body>
</html>
